name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice \
            poppler-utils \
            libcairo2 \
            libpango-1.0-0 \
            libgdk-pixbuf2.0-0 \
            fonts-dejavu-core \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          # requirements.txt in this repo includes code fences; strip them safely
          sed '/^```/d' requirements.txt > /tmp/reqs.txt || cp requirements.txt /tmp/reqs.txt
          python -m pip install --upgrade pip
          pip install -r /tmp/reqs.txt

      - name: Run test suite
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python -m pytest -q
