version: '3.8'

services:
  # Frontend - React app in development mode
  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: converter-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      - backend
    networks:
      - converter-network
    restart: unless-stopped
    command: npm run dev -- --host

  # Backend - Flask API in development mode
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converter-backend-dev
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.main:app
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/converter.db}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt
      - converter-uploads:/tmp/docpro_uploads
      - converter-data:/data
    depends_on:
      - db
    networks:
      - converter-network
    restart: unless-stopped
    command: flask run --host=0.0.0.0

  # Database - SQLite
  db:
    image: alpine:latest
    container_name: converter-db-dev
    volumes:
      - converter-data:/data
    networks:
      - converter-network
    command: /bin/true  # Placeholder for SQLite
    restart: unless-stopped

networks:
  converter-network:
    driver: bridge

volumes:
  converter-uploads:
    driver: local
  converter-data:
    driver: local
