version: '3.8'

# DocPro High Availability Configuration
# Includes: Nginx load balancer, multiple Flask instances, PostgreSQL with replication, Redis cluster

services:
  # ============================================================================
  # Load Balancer
  # ============================================================================
  
  nginx:
    image: nginx:1.26-alpine
    container_name: docpro-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - flask_1
      - flask_2
      - flask_3
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - TZ=UTC

  # ============================================================================
  # Flask Application Instances
  # ============================================================================
  
  flask_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docpro-flask-1
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://docpro:secure_password@postgres:5432/docpro
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - TZ=UTC
    expose:
      - 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads

  flask_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docpro-flask-2
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://docpro:secure_password@postgres:5432/docpro
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - TZ=UTC
    expose:
      - 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads

  flask_3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docpro-flask-3
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://docpro:secure_password@postgres:5432/docpro
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - TZ=UTC
    expose:
      - 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads

  # ============================================================================
  # Celery Workers
  # ============================================================================
  
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docpro-celery-worker
    command: celery -A app.celery_config worker --loglevel=info --concurrency=4
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://docpro:secure_password@postgres:5432/docpro
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - TZ=UTC
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - docpro_network
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docpro-celery-beat
    command: celery -A app.celery_config beat --loglevel=info
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://docpro:secure_password@postgres:5432/docpro
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - TZ=UTC
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - docpro_network
    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    container_name: docpro-flower
    command: celery --broker=redis://redis:6379/1 --port=5555
    expose:
      - 5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docpro_network
    restart: unless-stopped
    environment:
      - TZ=UTC

  # ============================================================================
  # Database (PostgreSQL with replication ready)
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: docpro-postgres
    environment:
      - POSTGRES_USER=docpro
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=docpro
      - POSTGRES_INITDB_ARGS=-c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpro"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - TZ=UTC

  # ============================================================================
  # Cache (Redis)
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: docpro-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - docpro_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    environment:
      - TZ=UTC

  # ============================================================================
  # Monitoring (Optional)
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: docpro-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    networks:
      - docpro_network
    restart: unless-stopped
    environment:
      - TZ=UTC

  grafana:
    image: grafana/grafana:latest
    container_name: docpro-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - docpro_network
    restart: unless-stopped
    environment:
      - TZ=UTC

# ============================================================================
# Networks and Volumes
# ============================================================================

networks:
  docpro_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
