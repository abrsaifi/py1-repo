version: '3.8'
services:
  libreoffice:
    image: libreoffice/latest
    container_name: libreoffice-daemon
    command: soffice --headless --accept="socket,host=0.0.0.0,port=2002;urp;" --norestore --nofirststartwizard
    ports:
      - "2002:2002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"timeout 1 bash -c '>/dev/tcp/127.0.0.1/2002' || exit 1\""]
      interval: 10s
      timeout: 2s
      retries: 5
