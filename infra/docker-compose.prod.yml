version: '3.8'

services:
  # Frontend - React app served by Nginx
  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: converter-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - converter-network
    restart: unless-stopped
    labels:
      - "com.converter.service=frontend"
      - "com.converter.version=3.5"

  # Backend - Flask API with gunicorn
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converter-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_APP=app.main:app
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - BILLING_PROVIDER_WEBHOOK_SECRET=${BILLING_PROVIDER_WEBHOOK_SECRET}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/converter.db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${WORKERS:-4}
      - TIMEOUT=${TIMEOUT:-60}
    volumes:
      - converter-uploads:/tmp/docpro_uploads
      - converter-data:/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - converter-network
    restart: unless-stopped
    labels:
      - "com.converter.service=backend"
      - "com.converter.version=3.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database - SQLite (for development/small deployments)
  # For production, use PostgreSQL instead (uncomment below)
  db:
    image: alpine:latest
    container_name: converter-db
    volumes:
      - converter-data:/data
    networks:
      - converter-network
    command: /bin/true  # Placeholder, SQLite uses file-based storage
    restart: unless-stopped
    labels:
      - "com.converter.service=database"

  # Optional: PostgreSQL for production (uncomment to use)
  # db:
  #   image: postgres:15-alpine
  #   container_name: converter-db
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-converter}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_NAME:-converter}
  #   volumes:
  #     - converter-db-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-converter}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - converter-network
  #   restart: unless-stopped

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: converter-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - converter-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - converter-network
    restart: unless-stopped
    labels:
      - "com.converter.service=monitoring"
    profiles: ["monitoring"]

  # Optional: Logging with ELK stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: converter-elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      xpack.security.enabled: "true"
    volumes:
      - converter-elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: curl -s http://localhost:9200 > /dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - converter-network
    restart: unless-stopped
    labels:
      - "com.converter.service=logging"
    profiles: ["logging"]

networks:
  converter-network:
    driver: bridge

volumes:
  converter-uploads:
    driver: local
  converter-data:
    driver: local
  converter-prometheus-data:
    driver: local
    name: converter-prometheus-data
  converter-elasticsearch-data:
    driver: local
    name: converter-elasticsearch-data
  converter-db-data:
    driver: local
    name: converter-db-data
