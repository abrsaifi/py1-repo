apiVersion: v1
kind: Namespace
metadata:
  name: docpro

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: docpro-config
  namespace: docpro
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  CACHE_TYPE: "redis"
  CACHE_DEFAULT_TIMEOUT: "300"
  SQLALCHEMY_POOL_SIZE: "20"
  SQLALCHEMY_MAX_OVERFLOW: "20"

---

apiVersion: v1
kind: Secret
metadata:
  name: docpro-secrets
  namespace: docpro
type: Opaque
stringData:
  DATABASE_URL: "postgresql://docpro:secure_password@postgres:5432/docpro"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  SECRET_KEY: "change_me_in_production_with_random_32_char_string"
  JWT_SECRET_KEY: "change_me_in_production_with_random_32_char_string"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: docpro
  labels:
    app: flask-app
spec:
  replicas: 3  # Initial replicas, will be scaled by HPA
  selector:
    matchLabels:
      app: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime deployments
  template:
    metadata:
      labels:
        app: flask-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: flask-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Anti-affinity: spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - flask-app
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: flask-app
        image: docpro:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        
        # Environment variables
        envFrom:
        - configMapRef:
            name: docpro-config
        - secretRef:
            name: docpro-secrets
        
        # Startup probe (app initialization)
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12  # 60 seconds total
        
        # Readiness probe (ready to serve traffic)
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Liveness probe (still running)
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Volume mounts
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      
      volumes:
      - name: uploads
        emptyDir:
          sizeLimit: 10Gi
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      
      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: docpro
  labels:
    app: flask-app
spec:
  type: ClusterIP
  selector:
    app: flask-app
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP  # Sticky sessions
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-app-hpa
  namespace: docpro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-app
  
  # Scale between 3 and 20 pods
  minReplicas: 3
  maxReplicas: 20
  
  # Scaling metrics
  metrics:
  
  # CPU-based scaling: scale up if CPU > 70%
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling: scale up if memory > 80%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metric: scale based on request rate
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  
  # Scaling behavior (how fast to scale)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50  # Scale down by 50% max
        periodSeconds: 60
      - type: Pods
        value: 2   # Remove max 2 pods
        periodSeconds: 60
      selectPolicy: Min  # Pick the policy that scales down the least
    
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100  # Scale up by 100% max (double)
        periodSeconds: 30
      - type: Pods
        value: 4    # Add max 4 pods
        periodSeconds: 30
      selectPolicy: Max  # Pick the policy that scales up the most

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-app
  namespace: docpro

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flask-app
  namespace: docpro
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flask-app
  namespace: docpro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flask-app
subjects:
- kind: ServiceAccount
  name: flask-app
  namespace: docpro

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flask-app-pdb
  namespace: docpro
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: flask-app

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: docpro
  labels:
    app: celery-worker
spec:
  replicas: 2  # Auto-scaled separately
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: docpro:latest
        command: ["celery", "-A", "app.celery_config", "worker", "--loglevel=info", "--concurrency=4"]
        
        envFrom:
        - configMapRef:
            name: docpro-config
        - secretRef:
            name: docpro-secrets
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      
      volumes:
      - name: uploads
        emptyDir:
          sizeLimit: 10Gi
      
      terminationGracePeriodSeconds: 30

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  namespace: docpro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  
  minReplicas: 2
  maxReplicas: 10
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docpro
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: pgql
        
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: docpro-secrets
              key: DATABASE_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docpro-secrets
              key: DATABASE_PASSWORD
        - name: POSTGRES_DB
          value: docpro
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U docpro
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U docpro
          initialDelaySeconds: 5
          periodSeconds: 10
        
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docpro
  labels:
    app: postgres
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: docpro
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
        
        ports:
        - containerPort: 6379
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      
      volumes:
      - name: redis-storage
        emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: docpro
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docpro-netpol
  namespace: docpro
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: docpro
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: docpro
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: docpro-quota
  namespace: docpro
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 10Gi
    limits.cpu: "20"
    limits.memory: 20Gi
    pods: "50"
