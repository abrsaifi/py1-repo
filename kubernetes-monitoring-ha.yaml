apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: docpro
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'docpro-prod'
        environment: 'kubernetes'
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    
    rule_files:
      - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # Flask application metrics
      - job_name: 'flask-app'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - docpro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: flask-app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metric_path: '/metrics'
        scrape_interval: 15s
      
      # Celery worker metrics
      - job_name: 'celery-worker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - docpro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: celery-worker
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      
      # PostgreSQL metrics (via postgres_exporter)
      - job_name: 'postgres'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - docpro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: postgres
      
      # Redis metrics (via redis_exporter)
      - job_name: 'redis'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - docpro
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: redis
      
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: docpro
data:
  scaling-rules.yml: |
    groups:
      - name: autoscaling
        interval: 30s
        rules:
          # High CPU usage alert
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total[5m]) > 0.7
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "{{ $labels.pod }} CPU > 70% for 5 minutes"
          
          # High memory usage alert
          - alert: HighMemoryUsage
            expr: container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "{{ $labels.pod }} memory > 80% of limit"
          
          # Pod restart alert
          - alert: PodRestarts
            expr: rate(kube_pod_container_status_restarts_total[1h]) > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod restarting too frequently"
              description: "{{ $labels.pod }} has restarted 5+ times in 1 hour"
          
          # High request latency alert
          - alert: HighRequestLatency
            expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High request latency detected"
              description: "p99 latency > 1 second"
          
          # Database connection pool exhaustion
          - alert: DBConnectionPoolLow
            expr: (pg_stat_activity_count / pg_setting_max_connections) > 0.8
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Database connection pool near exhaustion"
              description: "{{ $value | humanizePercentage }} of max connections in use"
          
          # Celery queue depth alert
          - alert: CeleryQueueDepth
            expr: celery_task_queue_length > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Large Celery task queue buildup"
              description: "{{ $value }} tasks pending in Celery queue"

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: docpro
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=30d"
          - "--web.enable-lifecycle"
        
        ports:
        - containerPort: 9090
          name: web
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus
      
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-rules
        configMap:
          name: prometheus-rules
  
  volumeClaimTemplates:
  - metadata:
      name: prometheus-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: docpro
spec:
  clusterIP: None
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    name: web

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: docpro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        args:
          - "--config.file=/etc/alertmanager/alertmanager.yml"
          - "--storage.path=/alertmanager"
        
        ports:
        - containerPort: 9093
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-storage
          mountPath: /alertmanager
      
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        emptyDir: {}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: docpro
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: "YOUR_SLACK_WEBHOOK_URL"
    
    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      routes:
        - match:
            severity: critical
          receiver: pagerduty
          group_wait: 0s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: slack
    
    receivers:
      - name: 'default'
        slack_configs:
          - channel: '#alerts'
            title: 'DocPro Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      
      - name: 'pagerduty'
        pagerduty_configs:
          - service_key: "YOUR_PAGERDUTY_KEY"
      
      - name: 'slack'
        slack_configs:
          - channel: '#warnings'
            title: 'DocPro Warning'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

---

apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: docpro
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: docpro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        
        ports:
        - containerPort: 3000
        
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin_password
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "false"
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
      
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: docpro
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true

---

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: docpro
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: docpro

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: docpro

---

apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: docpro
type: Opaque
stringData:
  admin_password: "change_me_secure_password"

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-pdb
  namespace: docpro
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prometheus

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  namespace: docpro
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grafana
