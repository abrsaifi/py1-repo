# Logstash configuration for Document Converter

input {
  # Docker logs
  stdin {
    codec => json
  }

  # File-based logs from backend
  file {
    path => "/var/log/converter/app.log"
    start_position => "beginning"
    codec => json
  }

  # Nginx access logs
  file {
    path => "/var/log/nginx/access.log"
    codec => json
  }
}

filter {
  # Parse JSON logs
  json {
    source => "message"
  }

  # Add timestamp if not present
  if ![timestamp] {
    date {
      match => [ "time", "dd/MMM/YYYY:HH:mm:ss Z" ]
      target => "@timestamp"
    }
  }

  # Extract Flask request information
  if [type] == "flask" {
    grok {
      match => { "message" => "%{WORD:method} %{DATA:path} %{DATA:protocol} %{NUMBER:status} %{NUMBER:response_time}" }
    }
  }

  # Remove sensitive fields
  mutate {
    remove_field => [ "password", "token", "api_key", "secret" ]
  }

  # Add metadata
  mutate {
    add_field => { "service" => "converter" }
    add_field => { "environment" => "${ENVIRONMENT:production}" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "converter-%{+YYYY.MM.dd}"
    ecs_compatibility => "disabled"
  }

  # Also log to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
