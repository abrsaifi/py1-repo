# Nginx Reverse Proxy and Load Balancer Configuration
# Task 6: Load Balancing & High Availability

upstream docpro_backend {
    # Connection pool settings
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
    
    # Backend servers (adjust based on actual instances)
    server flask_app_1:5000 weight=1 max_fails=3 fail_timeout=30s;
    server flask_app_2:5000 weight=1 max_fails=3 fail_timeout=30s;
    server flask_app_3:5000 weight=1 max_fails=3 fail_timeout=30s;
    
    # Sticky sessions (IP-based)
    # Uncomment for session affinity
    # hash $remote_addr consistent;
    
    # Or use cookie-based session persistence
    # sticky cookie srv_route expires=1h path=/ httponly secure samesite=lax;
}

# Rate limiting setup
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $http_x_api_key zone=api_key_limit:10m rate=100r/s;
limit_req_zone $server_name zone=server_limit:10m rate=1000r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docpro.example.com;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/docpro.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docpro.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    # Logging
    access_log /var/log/nginx/docpro_access.log combined buffer=32k;
    error_log /var/log/nginx/docpro_error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    gzip_disable "MSIE [1-6]\.";
    
    # Buffer sizes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Health check endpoint (no rate limit, no auth)
    location /health {
        proxy_pass http://docpro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 10 second timeout for health checks
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        
        # Don't cache health responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # Allow from monitoring systems only
        # allow 10.0.0.0/8;  # Internal network
        # deny all;
    }
    
    # API rate limiting
    location ^~ /api/ {
        # Rate limiting
        limit_req zone=server_limit burst=100 nodelay;
        limit_req zone=api_limit burst=30 nodelay;
        
        # Identify by API key if present
        if ($http_x_api_key != "") {
            limit_req zone=api_key_limit burst=100 nodelay;
        }
        
        # Proxy settings
        proxy_pass http://docpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection pooling from nginx to backend
        keepalive_timeout 65s;
        
        # Redirect errors to error page
        error_page 502 503 504 /50x.html;
    }
    
    # Admin routes (stricter rate limiting and IP restriction)
    location ^~ /api/admin/ {
        # Stricter rate limiting
        limit_req zone=api_limit burst=10 nodelay;
        
        # Restrict to admin IPs (update as needed)
        # allow 10.0.0.0/8;  # Internal network
        # allow 203.0.113.0/24;  # VPN range
        # deny all;
        
        proxy_pass http://docpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    
    # Webhook route (higher timeout for long processing)
    location /api/webhooks {
        limit_req zone=server_limit burst=50 nodelay;
        
        proxy_pass http://docpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for webhook operations
        proxy_read_timeout 120s;
    }
    
    # Analytics (can be cached)
    location ^~ /api/analytics/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://docpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache analytics responses for 5 minutes
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Static files (React frontend)
    location / {
        alias /app/frontend-analytics/dist/;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache HTML
        location ~* \.html$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
        
        # SPA routing - fallback to index.html
        try_files $uri $uri/ /index.html;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}

# Cache configuration (optional)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=docpro_cache:10m max_size=1g inactive=60m use_temp_path=off;

# Map for cache status
map $upstream_cache_status $cache_status {
    MISS miss;
    EXPIRED expired;
    UPDATED updated;
    STALE stale;
    HIT hit;
    BYPASS bypass;
}
