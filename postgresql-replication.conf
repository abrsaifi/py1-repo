# PostgreSQL Replication Configuration
# Primary Server (postgres-primary)
# Enables streaming replication for high availability

# ==========================
# Network and Connection Settings
# ==========================

# Accept all connections (behind firewall in production)
listen_addresses = '*'
port = 5432

# Maximum number of replication connections
max_wal_senders = 10
wal_keep_size = 1GB  # Keep 1GB of WAL files for replication

# ==========================
# WAL (Write-Ahead Log) Settings
# ==========================

# Writing mode for maximum safety
wal_level = replica  # Enable WAL for replication (required for streaming replication)
wal_sync_method = fsync  # Safest: wait for disk flush
synchronous_commit = remote_apply  # Wait for standby to confirm

# WAL file size (default 16MB, increase for high-traffic systems)
wal_segment_size = 16MB

# ==========================
# Archive Settings (for backup and point-in-time recovery)
# ==========================

# Enable WAL archiving
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300  # Archive WAL every 5 minutes even if not full

# ==========================
# Replication Synchronization
# ==========================

# Synchronous replication: wait for at least one standby to confirm
synchronous_standby_names = '*'  # All standbys

# Timeout for synchronous replication (in milliseconds)
# If standby doesn't respond, continue anyway
synchronous_commit = remote_apply

# ==========================
# Performance Tuning
# ==========================

shared_buffers = 256MB  # 25% of system RAM (4GB system)
effective_cache_size = 1GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 32MB

# ==========================
# Replication Slot Settings
# ==========================

# Use replication slots for reliable streaming
# Prevents WAL removal before standby acknowledges
# max_replication_slots = 10  # Default is fine

# ==========================
# Security
# ==========================

# Require replication connections to be encrypted (in production)
# ssl = on
# ssl_cert_file = '/etc/postgresql/server.crt'
# ssl_key_file = '/etc/postgresql/server.key'

# ==========================
# Logging
# ==========================

logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

log_line_prefix = '%t [%p] %u@%d '

# Log checkpoint and WAL activities
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_statement = 'mod'  # Log DDL/DML, not SELECT
log_min_duration_statement = 1000  # Log queries > 1 second

# Replication logging
log_replication_commands = on

# ==========================
# Backup and Recovery
# ==========================

# Enable WAL archiving for PITR (point-in-time recovery)
restore_command = 'cp /var/lib/postgresql/wal_archive/%f %p'

# Recovery settings (only used on standby when promoting)
recovery_target_timeline = 'latest'

# ==========================
# Monitoring
# ==========================

# Enable statistics for monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000
