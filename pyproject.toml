[project]
name = "py1"
version = "0.1.0"
description = "PDF/image processing utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
"Homepage" = "https://example.local/py1"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.dependencies]
# Minimal runtime dependencies (what the package needs at runtime)
pdf2image = "==1.17.0"
Pillow = "==12.1.1"
img2pdf = "==0.5.1"
click = "==8.3.1"

[project.optional-dependencies]
# Development and optional extras grouped for convenience
dev = [
	"pytest==9.0.2",
	"pytest-cov==5.0.0",
	"pytest-timeout==2.1.0",
	"pytest-flask==1.3.0",
	"black==24.10.0",
	"pylint==3.3.3",
	"flake8==7.1.2",
	"mypy==1.14.1",
]

extras = [
	"Flask==3.1.2",
	"Werkzeug==3.1.5",
	"PyMuPDF==1.27.1",
	"pypdf==3.18.0",
	"pdfminer.six==20251230",
	"pdfplumber==0.11.9",
	"reportlab==4.4.10",
	"opencv-python-headless==4.13.0.92",
	"python-docx==1.2.0",
	"python-pptx==1.0.2",
	"openpyxl==3.1.5",
	"docx2pdf==0.1.8",
	"pandas==3.0.1",
	"numpy==2.4.2",
	"easyocr==1.7.2",
	"torch==2.10.0",
	"requests==2.32.5",
	"beautifulsoup4==4.14.3",
	"weasyprint==68.1",
	"pdfkit==1.0.0",
	"google-auth-oauthlib==1.2.0",
	"google-auth-httplib2==0.2.0",
	"google-api-python-client==2.105.0",
	"python-dropbox==11.36.2",
	"O365==4.10.1",
	"azure-storage-blob==12.19.0",
	"python-json-logger==2.0.7",
	"protobuf==5.28.3",
	"python-dotenv==1.0.1",
	"cryptography==46.0.5",
	"celery==5.4.0",
	"redis==5.1.1",
	"schedule==1.2.2",
	"SQLAlchemy==2.0.32",
	"alembic==1.14.1",
	"flask-restx==1.3.2",
	"flask-swagger-ui==4.11.1",
	"Flask-Limiter==4.0.0",
	"Flask-CORS==4.0.0",
	"Flask-Talisman==1.1.0",
	"sendgrid==6.11.0",
]

[project.scripts]
py1-cli = "app.cli:pdf_to_true_bw"
